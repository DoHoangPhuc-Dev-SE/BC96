<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Array</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <div class="container">
         

              <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Bài tập Thêm Phần Tử Vào Mảng trong JavaScript</h4>
                    <div class="py-3">
                        <div class="mb-3">
                            <label for="" class="form-label">Loại</label>
                            <select
                                class="form-select form-select-lg"
                                name=""
                                id="txtType"
                                onchange = "onChangeType()"
                            >
                                <option selected>Select one</option>
                                <option value="1">Thêm vào đầu</option>
                                <option value="2">Thêm vào Cuối</option>
                                <option value="3">Thêm vị trí</option>
                            </select>
                        </div>
                        
                        
                        <div class="mb-3">
                            <label for="" class="form-label">Phần tử:</label>
                            <input
                                type="text"
                                class="form-control"
                                name=""
                                id="txtItem"
                                aria-describedby="helpId"
                                placeholder="Nhập phần tử cần thêm"
                            />
                        </div>
                        <!-- INPUT VỊ TRÍ -->
                        <div class="mb-3 d-none" id="divIndex">
                            <label for="" class="form-label">Vị trí:</label>
                            <input
                                type="text"
                                class="form-control"
                                name=""
                                id="txtIndex"
                                aria-describedby="helpId"
                                placeholder="Nhập vị trí cần thêm"
                            />
                        </div>
                        <div class="d-flex gap-3">
                            <button class="btn btn-outline-primary">Thêm</button>
                            
                        </div>
                        <div class="" id="bt1Resuld"></div>
                        
                    </div>
                </div>
            </div>
            
        </div>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <script src="./js/array.js"></script>
    </body>
</html>
