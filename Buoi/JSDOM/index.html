<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />

        <link rel="icon" href="data:;base64,iVBORw0KGgo=">

        <link rel="stylesheet" href="./css/index.css">
    </head>

    <body class="container">
       <h1>Hello</h1>
       <p class="text">BC96</p>

       <h1>Hello 2</h1>

       <img src="https://upload.wikimedia.org/wikipedia/vi/a/a1/Man_Utd_FC_.svg?utm_source=vi.wikipedia.org&utm_campaign=index&utm_content=original" alt="" width="500px">

        <a href="https://google.com">Google</a>

        <div class="doi-class">
            <p class="tittle">Hi BC96</p>
        </div>

        <button class="change-theme">Light/dark</button>


        <br>
        <div id ="card1" class="card text-start w-25">
            <img class="card-img-top" src="https://i.pravatar.cc/150?img=3" alt="Title" />
            <div class="card-body">
                <h4 class="card-title">Van A</h4>
                <p class="card-text">Develop</p>
            </div>
            
            <div class="card-footer text-body-secondary">
                <button class="btn btn-info">Next</button>
            </div>
        </div>

        <div class="row">
            <div class="col-6">
                <div class="mb-3 w-25 py-5">
                <label for="" class="form-label">Email</label>
                <input
                    type="email"
                    class="form-control"
                    name=""
                    id="email"
                    aria-describedby="emailHelpId"
                    placeholder="abc@mail.com"
                />
                <button id="submit-email" class="btn btn-primary mt-5">Submit</button>
            </div>
            </div>
            <div class="col-6">
                <h1>Kết quả nhập form</h1>
                <p class="ket-qua-email"></p>
            </div>
        </div>
      
  
        <!-- BT1 -->
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Thông tin người dùng</h4>
            </div>

            <div class="card-body">
                <div class="row">

                    <!-- Cột trái -->
                    <div class="col-md-6 border-end">

                        <h5 class="mb-4">Nhập thông tin</h5>

                        <div class="mb-3">
                            <label class="form-label">Họ và tên</label>
                            <input
                                type="text"
                                class="form-control"
                                id="fullName"
                                placeholder="Nhập họ và tên">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                placeholder="Nhập email">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Số điện thoại</label>
                            <input
                                type="tel"
                                class="form-control"
                                id="phone"
                                placeholder="Nhập số điện thoại">
                        </div>

                        <button id="btn-bt1" class="btn btn-primary">
                            Lưu thông tin
                        </button>

                    </div>

                    <!-- Cột phải -->
                    <div class="col-md-6">

                        <h5 class="mb-4">Thông tin vừa nhập</h5>

                        <div class="card bg-light">
                            <div class="card-body">

                                <p>
                                    <strong>Họ và tên:</strong><br>
                                    <span id="showName">Chưa nhập</span>
                                </p>

                                <hr>

                                <p>
                                    <strong>Email:</strong><br>
                                    <span id="showEmail">Chưa nhập</span>
                                </p>

                                <hr>

                                <p>
                                    <strong>Số điện thoại:</strong><br>
                                    <span id="showPhone">Chưa nhập</span>
                                </p>

                            </div>
                        </div>

                    </div>

                </div>
            </div>
        </div>

    
        <!-- Password -->
        <div class="card shadow my-5">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Hiển thị mật khẩu</h4>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-12 border-end">
                        <h5 class="mb-4">Nhập thông tin</h5>
                        <div class="mb-3">
                            <label class="form-label"><Mật khẩu></label>
                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                placeholder="Nhập mật khẩu">
                        </div>
                        <button id="btn-bt2" class="btn btn-primary">Hiện mật khẩu</button>
                    </div>             
                </div>
            </div>
        </div>

        <!-- type khác : date,color,files,checkbox,radio,select -->
         <!-- BT3 -->
        <div class="card shadow my-5">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Checkbox - Radio - Select</h4>
        </div>
        <div class="card-body">
            <!-- Thành phố -->
            <div class="mb-3">
            <label class="form-label">Thành phố</label>

            <select class="form-select" id="city">
                <option value="">-- Chọn thành phố --</option>
                <option>Nha Trang</option>
                <option>Đà Nẵng</option>
                <option>TP.HCM</option>
                <option>Hà Nội</option>
            </select>
            </div>
            <!-- Radio -->
            <div class="mb-3">
            <label class="form-label d-block">Giới tính</label>

            <div class="form-check form-check-inline">
                <input
                class="form-check-input"
                type="radio"
                name="gender"
                value="Nam"
                checked
                />
                <label class="form-check-label">Nam</label>
            </div>

            <div class="form-check form-check-inline">
                <input
                class="form-check-input"
                type="radio"
                name="gender"
                value="Nữ"
                />
                <label class="form-check-label">Nữ</label>
            </div>
            </div>

            <!-- Checkbox -->
            <div class="mb-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="agree" checked />
                <label class="form-check-label">Đồng ý điều khoản</label>
            </div>
            </div>
        </div>
        <!-- Switch -->
        <div class="mb-3">
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="darkMode" />

            <label class="form-check-label"> Dark Mode </label>
        </div>
        </div>
        <button id="btn-bt3" class="btn btn-primary">Save</button>
        </div>

                

        <input type="password" name="" id="">

        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>

        <script src="./js/index.js"></script>
    </body>
</html>
