<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Login</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h3 class="text-center mb-4">Login</h3>

              <form id="loginForm">
                <!-- Email -->
                <div class="mb-3">
                  <label for="email" class="form-label"> Email </label>

                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="Enter Email"
                  />
                </div>

                <!-- Password -->
                <div class="mb-3">
                  <label for="password" class="form-label"> Password </label>

                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="Enter password"
                  />
                </div>

                <!-- Button -->
                <button type="submit" class="btn btn-dark w-100">Login</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- axios: Axios là một thư viện JavaScript dùng để gọi API qua HTTP -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.19.0/axios.min.js"
      integrity="sha512-1PySIDbtpe3dqJixTAKYVuIJFjhCh6B++coWLFxuQh1es5sQo6eMciiiR8ppJQE4/goMfeJgKZN0ajzWWwuCGg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <script type="module" src="./js/pages/login.js"></script>
  </body>
</html>
