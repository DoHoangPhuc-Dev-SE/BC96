<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
     <!--  Tính giai thừa của số n -->
    <!--  4! = 1*2*3*5=4 -->
    <div class="row justify-content-center py-5">
      <div class="col-6">
        <div class="card text-start my-3">
          <div class="card-body">
            <h4 class="card-title">BT Tính Giai Thừa</h4>
            <div class="mb-3">
              <label for="" class="form-label">Nhập số n</label>
              <input
                type="text"
                class="form-control"
                name=""
                id="txtGiaiThua"
                aria-describedby="helpId"
                placeholder=""
              />
              <button
                class="btn btn-outline-primary my-2"
                onclick="tinhGiaiThua()"
              >
                Tính
              </button>
              <small
                id="kqGiaiThua"
                class="form-text text-body-secondary"
              ></small>
            </div>
          </div>
        </div>

        <div class="card text-start my-3">
          <div class="card-body">
            <h4 class="card-title">Câu 4 slide trang 15</h4>
            <button class="btn btn-outline-info" onclick="bt4()">
              In thẻ div
            </button>

            <div id="cau4">
                
            </div>
          </div>
        </div>
        <div class="card text-start my-3">
          <div class="card-body">
            <h4 class="card-title">Câu 5 slide trang 15</h4>

            <button class="btn btn-outline-info" onclick="bt5()">Tìm n</button>

            <div id="cau5"></div>
          </div>
        </div>
        <div class="card text-start my-3">
          <div class="card-body">
            <h4 class="card-title">Câu 6 slide trang 15</h4>
            <div class="mb-3 row">
              <div class="col-6">
                <label for="" class="form-label">Nhập số n</label>
                <input
                  type="text"
                  class="form-control"
                  name=""
                  id="bt5_txtN"
                  aria-describedby="helpId"
                  placeholder=""
                />
              </div>
              <div class="col-6">
                <label for="" class="form-label">Nhập số X</label>
                <input
                  type="text"
                  class="form-control"
                  name=""
                  id="bt5_txtX"
                  aria-describedby="helpId"
                  placeholder=""
                />
              </div>
            </div>

            <button class="btn btn-outline-info" onclick="bt6()">Tính</button>

            <div id="cau6"></div>
          </div>
        </div>
      </div>
    </div>


        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <script src="./js/index.js"></script>
    </body>
</html>
