<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Quản lý nhân viên</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container py-5">
      <h2 class="text-center mb-4">QUẢN LÝ NHÂN VIÊN</h2>

      <!-- FORM -->
      <div class="card shadow-sm mb-4">
        <div class="card-header">
          <h5 class="mb-0">Thông tin nhân viên</h5>
        </div>

        <div class="card-body">
          <div class="row g-3">
            <!-- Mã NV -->
            <div class="col-md-6">
              <label class="form-label">Mã nhân viên</label>

              <input id="maNV" class="form-control" placeholder="NV01" />
            </div>

            <!-- Họ tên -->
            <div class="col-md-6">
              <label class="form-label">Họ tên</label>

              <input
                id="hoTen"
                class="form-control"
                placeholder="Nguyễn Văn A"
              />
            </div>

            <!-- Lương -->
            <div class="col-md-6">
              <label class="form-label"> Lương cơ bản </label>

              <input
                id="luongCB"
                type="number"
                class="form-control"
                placeholder="10000000"
              />
            </div>

            <!-- Loại -->
            <div class="col-md-6">
              <label class="form-label"> Loại nhân viên </label>

              <select
                id="loaiNV"
                class="form-select"
                onchange="changeType(this)"
              >
                <option value="">--Chọn phân loại--</option>

                <option value="quanly">Quản lý</option>

                <option value="seller">Seller</option>
              </select>
            </div>

            <!-- Quản lý -->
            <div id="groupQuanLy" class="col-md-6 d-none">
              <label class="form-label"> Số lượng nhân viên quản lý </label>

              <input
                id="soLuongNV"
                type="number"
                class="form-control"
                value="0"
              />
            </div>

            <!-- Seller -->
            <div id="groupSeller" class="col-md-6 d-none">
              <label class="form-label"> KPI </label>

              <input
                id="kpi"
                type="number"
                step="0.1"
                class="form-control"
                placeholder="VD: 0.2"
              />
            </div>
          </div>
          <div class="d-none" id="thongBao"></div>

          <button id="btnAdd" class="btn btn-primary mt-4" onclick="themNV()">
            Thêm nhân viên
          </button>
          <button id="btnUpdate" class="btn btn-primary mt-4"  disabled onclick="capNhatNV()">
            Cập nhật
          </button>
          <button id="btnReset" class="btn btn-primary mt-4" onclick="reset()">
            Reset
          </button>
        </div>
      </div>

      <!-- TABLE -->

      <div class="card shadow-sm">
        <div class="card-header">
          <h5 class="mb-0">Danh sách nhân viên</h5>
        </div>

        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle">
              <thead class="table-dark">
                <tr>
                  <th>Mã NV</th>

                  <th>Họ tên</th>

                  <th>Loại</th>

                  <th>Lương CB</th>

                  <th>Thông tin thêm</th>

                  <th>Lương</th>

                  <th>Thao tác</th>
                </tr>
              </thead>

              <tbody id="tbodyNhanVien"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/main.js"></script>
  </body>
</html>
